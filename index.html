<body>
<title>Carnet des voitures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Atelier épuré : fond crème, une seule carte blanche par groupe, listes à filets fins,
   la couleur de chaque voiture réservée à son bandeau et à ses pastilles. */
:root {
  --bg: #F4F1EA; --surface: #FFFFFF; --surface-2: #EFEBE2; --ink: #1B2326; --ink-2: #4E575A; --ink-3: #646C6F;
  --line: #E7E2D7; --field: #FFFFFF; --field-line: #D2CABA;
  --nav: #1B2326; --nav-ink: #FFFFFF; --nav-ink-2: #AEB7B9; --primary: #1B2326; --on-primary: #FFFFFF;
  --late: #B42318; --soon: #9A4B05; --ok: #1B6E40; --info: #285E72;
  --late-bg: #FCE9E6; --soon-bg: #FCEFD9; --ok-bg: #E2F2E7; --info-bg: #E4EDF0;
  --grid: #ECE7DC; --axis: #C9C2B3; --chart-ink: #4E575A; --focus: #2a78d6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --scrim: rgba(17, 22, 24, .45); --shadow: 0 1px 2px rgba(27, 35, 38, .06);
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --t-xs: 12px; --t-sm: 14px; --t-md: 16px; --t-lg: 20px; --t-xl: 28px;
  --r-card: 20px; --r-field: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111618; --surface: #1A2225; --surface-2: #242D30; --ink: #ECE8DF; --ink-2: #B4BBBD; --ink-3: #959DA0;
    --line: #293235; --field: #141A1C; --field-line: #3A4447;
    --nav: #0A0E0F; --nav-ink: #FFFFFF; --nav-ink-2: #97A1A3; --primary: #ECE8DF; --on-primary: #111618;
    --late: #F4A097; --soon: #F2BD6B; --ok: #80D1A2; --info: #93C6D8;
    --late-bg: #3A1D1B; --soon-bg: #382A14; --ok-bg: #15301F; --info-bg: #1C2D33;
    --grid: #263033; --axis: #3B4649; --chart-ink: #B4BBBD; --focus: #6da7ec;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --scrim: rgba(0, 0, 0, .6); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111618; --surface: #1A2225; --surface-2: #242D30; --ink: #ECE8DF; --ink-2: #B4BBBD; --ink-3: #959DA0;
  --line: #293235; --field: #141A1C; --field-line: #3A4447;
  --nav: #0A0E0F; --nav-ink: #FFFFFF; --nav-ink-2: #97A1A3; --primary: #ECE8DF; --on-primary: #111618;
  --late: #F4A097; --soon: #F2BD6B; --ok: #80D1A2; --info: #93C6D8;
  --late-bg: #3A1D1B; --soon-bg: #382A14; --ok-bg: #15301F; --info-bg: #1C2D33;
  --grid: #263033; --axis: #3B4649; --chart-ink: #B4BBBD; --focus: #6da7ec;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --scrim: rgba(0, 0, 0, .6); --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--t-md); line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font-family: var(--font); color: inherit; font-size: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
img { display: block; }
.ic { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.hint { font-size: var(--t-sm); color: var(--ink-2); }
.hint .ic { display: inline-block; vertical-align: -3px; }
.small { font-size: var(--t-sm); }

.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 22px 0 14px; }
.top-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top-actions { display: flex; gap: 8px; }
.eyebrow { font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
.top h1 { font-size: var(--t-xl); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.section { display: flex; flex-direction: column; gap: 8px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 4px 0; }
.section-head h2 { font-size: var(--t-md); font-weight: 800; }
.section-head .aside { font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Boutons */
.btn { min-height: 46px; padding: 0 18px; border-radius: 23px; border: none; background: var(--surface); color: var(--ink);
  font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.line { background: transparent; border: 1px solid var(--field-line); }
.btn.quiet { background: transparent; padding: 0 10px; }
.btn.danger { background: var(--late-bg); color: var(--late); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: var(--t-sm); border-radius: 19px; }
.btn.grow { flex: 1; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 42px; height: 42px; border-radius: 21px; border: none; background: var(--surface); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: none; box-shadow: var(--shadow); }
.link { border: none; background: none; padding: 6px 2px; color: var(--ink-2); font-size: var(--t-sm); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Carte et listes groupées */
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); }
.card.pad { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card h2.ttl { font-size: var(--t-md); font-weight: 800; }
.rows > li + li > .row { border-top: 1px solid var(--line); }
.rows.inset > li + li > .row { border-top: none; background-image: linear-gradient(var(--line), var(--line)); background-size: calc(100% - 64px) 1px; background-position: right 0 top 0; background-repeat: no-repeat; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 14px; border: none; background: none; text-align: left; color: inherit; text-decoration: none; }
button.row:active, label.row:active { background: var(--surface-2); }
.rows > li:first-child > .row { border-top-left-radius: var(--r-card); border-top-right-radius: var(--r-card); }
.rows > li:last-child > .row { border-bottom-left-radius: var(--r-card); border-bottom-right-radius: var(--r-card); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-title { font-size: var(--t-md); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.row-sub { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.35; overflow-wrap: anywhere; }
.row-trail { flex: none; text-align: right; font-size: var(--t-md); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.row-trail.soft { font-size: var(--t-sm); font-weight: 700; color: var(--ink-2); }
.row .chev { color: var(--ink-3); }
.tile { width: 38px; height: 38px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--ink-2); }
.tile.car { background: color-mix(in srgb, var(--cc) 15%, var(--surface)); color: var(--ink-2); color: color-mix(in oklab, var(--cc) 72%, var(--ink)); }
.tile.dark { background: var(--primary); color: var(--on-primary); }
.tile.s-late { background: var(--late-bg); color: var(--late); } .tile.s-soon { background: var(--soon-bg); color: var(--soon); }
.tile.s-ok { background: var(--ok-bg); color: var(--ok); } .tile.s-unknown { background: var(--info-bg); color: var(--info); }
.clip { display: inline-block; vertical-align: -2px; color: var(--ink-3); margin-left: 4px; }
.empty { padding: 22px 18px; color: var(--ink-2); font-size: var(--t-sm); text-align: center; }
.card > .empty { padding: 26px 18px; }

/* Statut : une pastille et un mot, jamais une étiquette pleine */
.dot { width: 10px; height: 10px; border-radius: 5px; display: inline-block; flex: none; }
.st-late { color: var(--late); } .st-soon { color: var(--soon); } .st-ok { color: var(--ok); } .st-unknown { color: var(--info); }
.sdot { width: 9px; height: 9px; border-radius: 5px; display: inline-block; flex: none; background: currentColor; }

/* Bandeau discret */
.note { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 16px; font-size: var(--t-sm); font-weight: 600; background: var(--info-bg); color: var(--info); }
.note p { flex: 1; min-width: 0; }
.note.warn { background: var(--soon-bg); color: var(--soon); }
.note.bad { background: var(--late-bg); color: var(--late); }
.note .btn { background: var(--surface); color: var(--ink); }

/* Cartes voitures */
.car { border-radius: var(--r-card); background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.car-band { display: flex; align-items: center; gap: 12px; padding: 16px 18px; width: 100%; border: none; text-align: left; color: inherit; }
.car-id { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.car-name { font-size: var(--t-lg); font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
.car-sub { font-size: var(--t-sm); font-weight: 600; }
.car-km { text-align: right; flex: none; }
.car-km .v { font-size: var(--t-lg); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.2; }
.car-km .l { font-size: var(--t-xs); font-weight: 700; }
.car-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stat { padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .l { font-size: var(--t-xs); font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
.stat .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v small { font-size: var(--t-sm); font-weight: 700; color: var(--ink-2); }
.car-next { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-top: 1px solid var(--line); font-size: var(--t-sm); font-weight: 700; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: inherit; }
.car-next span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Filtres : contrôle segmenté et liste déroulante en forme de pastille */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.segc { display: inline-flex; padding: 3px; border-radius: 22px; background: var(--surface-2); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.segc button { min-height: 36px; padding: 0 14px; border-radius: 19px; border: none; background: transparent; font-size: var(--t-sm); font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.segc button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.chip-select { min-height: 42px; border-radius: 21px; border: 1px solid var(--field-line); background: var(--field); padding: 0 34px 0 14px; font-size: var(--t-sm); font-weight: 700; color: var(--ink);
  appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 17px center, right 12px center; background-size: 5px 5px; background-repeat: no-repeat; }

/* Fiche véhicule */
.swatches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.swatch { justify-self: center; width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.swatch[disabled] { opacity: .35; }
.code { display: inline-block; min-width: 30px; padding: 0 6px; margin-right: 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink); font-size: var(--t-xs); font-weight: 800; text-align: center; line-height: 20px; }
.plan-item { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.plan-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: var(--t-sm); font-weight: 700; }
.copyline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.copyline .sel { user-select: all; font-weight: 800; font-size: var(--t-md); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: var(--t-sm); }
.kv dt { color: var(--ink-2); font-weight: 600; }
.kv dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

/* Formulaires */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .legend-label { font-size: var(--t-sm); font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
input[type="text"], input[type="date"], input[type="number"], input[type="tel"], input:not([type]), select, textarea {
  width: 100%; min-height: 48px; border: 1px solid var(--field-line); border-radius: var(--r-field); background: var(--field); color: var(--ink);
  font-size: var(--t-md); font-weight: 600; padding: 0 14px; }
input[type="date"] { -webkit-appearance: none; appearance: none; display: flex; align-items: center; }
textarea { padding: 12px 14px; min-height: 84px; resize: vertical; line-height: 1.4; }
input[type="color"] { width: 56px; height: 44px; padding: 2px; border: 1px solid var(--field-line); border-radius: 12px; background: var(--field); }
input.auto, select.auto, textarea.auto { border-color: color-mix(in srgb, var(--ok) 55%, var(--field-line)); }
input.chk, select.chk, textarea.chk { border-color: var(--soon); border-width: 2px; }
.mark { font-size: 11px; font-weight: 800; letter-spacing: .02em; padding: 1px 7px; border-radius: 8px; }
.mark.auto { background: var(--ok-bg); color: var(--ok); }
.mark.chk { background: var(--soon-bg); color: var(--soon); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.check { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; font-weight: 600; min-height: 30px; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--ink); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-opt { position: relative; min-height: 42px; padding: 0 15px; border-radius: 21px; border: 1px solid var(--field-line); display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--field); }
.seg-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg-opt:has(input:checked) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg-opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.form-err { padding: 12px 14px; border-radius: 14px; background: var(--soon-bg); color: var(--soon); font-size: var(--t-sm); font-weight: 700; }
fieldset.field { border: none; padding: 0; margin: 0; }
fieldset.field legend { margin-bottom: 8px; padding: 0; }

/* Feuilles (panneaux du bas) */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: var(--scrim); }
.sheet { width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 24px 24px 0 0;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: -6px; background: var(--bg); padding: 14px 0 8px; z-index: 2; }
.sheet-head h2 { font-size: var(--t-lg); font-weight: 800; }
.sheet-head .eyebrow { font-size: var(--t-xs); }
.sheet-actions { display: flex; gap: 10px; position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: var(--bg); padding: 10px 0 calc(6px + env(safe-area-inset-bottom, 0px)); margin-bottom: calc(-6px - env(safe-area-inset-bottom, 0px)); }

/* Ajouter : la photo d'abord */
.cap { display: flex; flex-direction: column; gap: 10px; }
.cap-main { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 12px 16px; border-radius: 20px; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.cap-main .tile { background: color-mix(in srgb, var(--on-primary) 16%, transparent); color: var(--on-primary); width: 44px; height: 44px; border-radius: 14px; }
.cap-main b { display: block; font-size: 17px; font-weight: 800; }
.cap-main span.s { font-size: var(--t-sm); font-weight: 600; }
.cap-alt { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cap-alt label, .cap-alt button { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 10px 12px; border-radius: 16px; background: var(--surface); font-size: 15px; font-weight: 700; cursor: pointer; border: none; text-align: left; box-shadow: var(--shadow); }
.type-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; }
.type-list li:nth-child(n+3) > .row { border-top: 1px solid var(--line); }
.type-list li:nth-child(even) > .row { border-left: 1px solid var(--line); }
.type-list .row { min-height: 56px; padding: 8px 12px; gap: 10px; font-size: 15px; font-weight: 700; border-radius: 0 !important; }
.type-list .tile { width: 34px; height: 34px; border-radius: 10px; }

/* Documents */
.doc-strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.thumb { width: 56px; height: 72px; border-radius: 10px; object-fit: cover; background: var(--surface-2); flex: none; }
.thumb.lg { width: 96px; height: 128px; border-radius: 14px; }
.doc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
@media (min-width: 520px) { .doc-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.doc-cell { display: flex; flex-direction: column; gap: 6px; padding: 0; border: none; background: none; text-align: left; color: inherit; min-width: 0; }

/* ============ Statistiques ============ */
function statsVids() { return U.sv === 'all' ? D.vehicles.map(v => v.id) : [U.sv]; }
function periodRange(p) {
  const t = todayStr(); const y = Number(t.slice(0, 4)); const m0 = t.slice(0, 7) + '-01';
  if (p === 'year') return { from: `${y}-01-01`, to: t, label: `en ${y}` };
  if (p === 'prev') return { from: `${y - 1}-01-01`, to: `${y - 1}-12-31`, label: `en ${y - 1}` };
  if (p === 'all') { const ds = D.events.map(e => e.date).concat(D.vehicles.map(v => v.achat && v.achat.date)).filter(validDate).sort(); return { from: ds[0] ? ds[0].slice(0, 7) + '-01' : t, to: t, label: 'depuis le début' }; }
  if (p === '3m') return { from: addMonths(m0, -2), to: t, label: 'sur 3 mois' };
  if (p === '24m') return { from: addMonths(m0, -23), to: t, label: 'sur 24 mois' };
  if (p === 'custom') {
    let a = validDate(D.settings.statsFrom) ? D.settings.statsFrom : addMonths(m0, -11), b = validDate(D.settings.statsTo) ? D.settings.statsTo : t;
    if (b > t) b = t; if (a > b) [a, b] = [b, a];
    return { from: a, to: b, label: `du ${fmtDateShort(a)} au ${fmtDateShort(b)}` };
  }
  return { from: addMonths(m0, -11), to: t, label: 'sur 12 mois' };
}

  const fk = P.from.slice(0, 7), tk = P.to.slice(0, 7);
  const cost = costIn(vids, fk, tk).reduce((s, a) => s + a.amount, 0);
  const km = vids.reduce((s, id) => s + kmDriven(id, P.from, P.to), 0);
  const TS = trackedStats(vids, P.from, P.to);
  const conso = weighted(TS.segs);
  const tkNote = vids.map(id => { const v = veh(id); const tf = trackFrom(v); return `${vids.length > 1 ? esc(v.surnom) + ' : ' : ''}${tf ? `carburant suivi depuis le ${fmtDate(tf)}${validDate(v.suivi) ? '' : ' (détecté)'}` : 'aucun plein saisi'}`; }).join(' · ');
  const cpkSub = TS.used.length ? (TS.used.some(u => u.partial) ? `depuis le ${fmtDateShort(TS.used.map(u => u.from).sort()[0])}` : '') : 'dès le premier plein';
  const pleins = D.events.filter(e => vids.includes(e.vehicleId) && e.type === 'plein' && e.date >= P.from && e.date <= P.to && num(e.litres) > 0 && num(e.montant) > 0);
  const L = pleins.reduce((s, e) => s + num(e.litres), 0), M = pleins.reduce((s, e) => s + num(e.montant), 0);
  const est = estOn(); const allP = costInAll(vids, fk, tk); const costAll = allP.reduce((s, a) => s + a.amount, 0); const estAmt = allP.filter(a => a.est).reduce((s, a) => s + a.amount, 0);

      ${est ? `<details class="card est-method"><summary>${ic('info', 16)}Comment sont faites les estimations${estAmt > 0.5 ? ` · ${fmtEur(estAmt)}` : ''}</summary><div class="est-body">${meth.map(m => `<p><b>${esc(m.v.surnom)}</b> : ${m.lines.map(esc).join(' ')}</p>`).join('')}<p class="hint">Prix : moyennes annuelles nationales Insee. Assurance : interpolée entre tes primes connues, et au-delà calée sur l’indice Eurostat des prix de l’assurance liée au transport. Une saisie réelle remplace toujours l’estimation.</p></div></details>` : ''}`,

    cost: () => `<section class="card chart-card"><h2 class="chart-title">Dépenses par ${yearly ? 'an' : 'mois'}</h2>${est && estAmt > 0.5 ? '<p class="chart-sub">Parties hachurées : estimations.</p>' : ''}<div class="legend" id="lg-cost"></div><div class="chart" id="ch-cost"></div></section>`,

      <label class="sr" for="sp">Période</label><select id="sp" class="chip-select" data-filter="sp">${STATS_PERIODS.map(([k, l]) => `<option value="${k}" ${U.sp === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button class="chip-toggle" data-action="est-toggle" aria-pressed="${est}">${ic(est ? 'check' : 'spark', 16, 2.4)}Estimations</button></div>
    ${U.sp === 'custom' ? `<div class="grid2"><div class="field"><label for="st-from">Du</label><input type="date" id="st-from" data-stat-range="statsFrom" value="${P.from}" max="${todayStr()}"></div><div class="field"><label for="st-to">Au</label><input type="date" id="st-to" data-stat-range="statsTo" value="${P.to}" max="${todayStr()}"></div></div>` : ''}
    <p class="hint" style="padding:0 4px;margin-top:-4px">${capFirst(tkNote)}. ${est ? (vids.some(id => trackFrom(veh(id))) ? 'Avant cette date, le carburant est estimé.' : 'Tout le carburant est estimé.') : 'Le coût au kilomètre, la consommation et la répartition partent de cette date ; avant, le carburant n’est pas suivi.'} <button class="link" style="display:inline;padding:0" data-action="track-edit">Modifier</button></p>
    ${on.length ? on.map(id => C[id] ? C[id]() : '').join('') : `<div class="card"><div class="empty">Toutes les cartes sont masquées. <button class="link" style="display:inline" data-action="stats-layout">Personnaliser</button></div></div>`}
    <div class="btnrow" style="justify-content:center"><button class="btn line sm" data-action="stats-layout">${ic('sliders', 16)}Choisir et ranger les cartes</button></div>

function yearTable(vids) {
  const ys = D.events.filter(e => vids.includes(e.vehicleId) && validDate(e.date)).map(e => e.date.slice(0, 4));
  if (estOn()) vids.forEach(id => estimAllocs([id], '1900-01', '2999-12').forEach(a => ys.push(a.month.slice(0, 4))));
  const years = [...new Set(ys)].sort().reverse();
  if (!years.length) return `<div class="card"><div class="empty">Pas encore de données.</div></div>`;
  const rows = []; let foot = false, estFoot = false;
  for (const y of years) for (const id of vids) {
    const v = veh(id); const from = `${y}-01-01`, to = `${y}-12-31`;
    const evs = vehEvents(id).filter(e => e.date.startsWith(y)); if (!evs.length && !costInAll([id], `${y}-01`, `${y}-12`).length) continue;
    const km = kmDriven(id, from, to);
    const al = costInAll([id], `${y}-01`, `${y}-12`); const cost = al.reduce((s, a) => s + a.amount, 0); const ea = al.filter(a => a.est).reduce((s, a) => s + a.amount, 0); if (ea > 0.5) estFoot = true;
    const T = trackedStats([id], from, to); const part = T.used[0] && T.used[0].partial; if (part) foot = true;
    const segs = T.segs;
    const pl = evs.filter(e => e.type === 'plein' && num(e.litres) > 0 && num(e.montant) > 0);
    const L = pl.reduce((s, e) => s + num(e.litres), 0), M = pl.reduce((s, e) => s + num(e.montant), 0);
    rows.push(`<tr><td>${y}${vids.length > 1 ? ` <span class="dot" style="background:${v.couleur}"></span>${esc(v.surnom)}` : ''}</td><td>${fmtN(km)}</td><td title="${L > 0 ? fmtN(M / L, 3) + ' €/L' : ''}">${segs.length ? fmtN(weighted(segs), 1) : '—'}</td><td title="${ea > 0.5 ? 'dont ' + fmtEur(ea) + ' estimés' : ''}">${ea > 0.5 ? '≈ ' : ''}${fmtEur(cost)}</td><td title="${T.used.length ? '' : 'Carburant non suivi cette année'}">${T.km > 0 ? (T.used.some(u => u.est) ? '≈ ' : '') + fmtN(T.cost / T.km, 2) + (part ? '*' : '') : '—'}</td></tr>`);
  }
  return `<div class="card tbl-wrap" tabindex="0" role="region" aria-label="Bilan par année"><table><thead><tr><th scope="col">Année</th><th scope="col">Km</th><th scope="col">L/100</th><th scope="col">Dépenses</th><th scope="col">€/km</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <p class="hint" style="padding:0 4px">${estOn() ? 'L/100 : pleins réels seulement. ≈ : montant comprenant des estimations.' : 'L/100 et €/km : seulement quand le carburant est suivi (— sinon).'}${foot ? ' * Calculé à partir du début du suivi, en cours d’année.' : ''}</p>`;
}

}
function docCell(x) {

  return new Blob([rec.full], { type: rec.type || 'image/jpeg' });
}
async function readDocLocal(doc, forced) {

  Queue.step('Chargement du moteur de lecture…', 0.06);
  await OCR.ensure();
  const modes = forced ? [forced] : doc.hint === 'km' ? ['km'] : ['gray', 'contrast'];
  let best = null;
  for (const m of modes) {
    Queue.step(m === 'contrast' && !forced ? 'Seconde lecture, contraste renforcé…' : 'Lecture du texte…', m === 'contrast' && !forced ? 0.6 : 0.25);
    const r = await OCR.recognize(prepCanvas(bmp, m), m === 'km');
    const p = parseDocText(r.text, ctxFor(doc)); p.text = r.text; p.score = parseScore(p);
    if (!best || p.score > best.score) best = p;
    if (best.fields.montant != null && best.conf.montant === 'ok') break;
  }
  if (bmp.close) bmp.close();
  applyParse(doc, best, 'local'); doc.text = String(best.text || '').slice(0, 4000);
}

  Queue.step('Lecture par Claude…', 0.3);

  const p = fromAi(j, ctxFor(doc));

/* ---------- Ajout de photos ---------- */
async function ingestOne(file, opts) {
  let bmp, pdf = null;
  if (isPdf(file)) { pdf = await pdfRead(file); bmp = pdf.canvas; } else bmp = await loadBitmap(file);
  const full = drawScaled(bmp, 2000), thumb = drawScaled(bmp, 360);
  if (bmp.close) bmp.close();
  const fb = await canvasBlob(full, 'image/jpeg', 0.85), tb = await canvasBlob(thumb, 'image/jpeg', 0.72);
  const id = uid();
  await Store.putFile(id, { full: await fb.arrayBuffer(), thumb: await tb.arrayBuffer(), type: 'image/jpeg', w: full.width, h: full.height });
  const doc = { id, added: new Date().toISOString(), name: String(file.name || '').slice(0, 80), size: fb.size, status: opts.eventId ? 'linked' : opts.pending ? 'kept' : pdf ? 'inbox' : 'queued', pending: !!opts.pending, hint: opts.hint || null, vehicleId: opts.vehicleId || null, eventId: opts.eventId || null, type: opts.hint === 'km' ? 'km' : null, fields: {}, conf: {} };
  if (pdf) {
    doc.pages = pdf.pages; doc.engine = 'pdf';
    if (doc.status === 'inbox') applyParse(doc, parseDocText(pdf.text, ctxFor(doc)), 'pdf');
    doc.text = pdf.text.slice(0, 8000);
  }
  D.docs.push(doc); return doc;
}
async function ingestFiles(fileList, opts = {}) {
  const files = Array.from(fileList || []).filter(f => /^image\//.test(f.type) || isPdf(f) || /\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name || ''));
  if (!files.length) { toast('Choisis une photo ou un PDF'); return []; }
  const out = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i]; if (files.length > 1) toast(`Préparation des photos ${i + 1}/${files.length}…`);
    try { out.push(await ingestOne(f, opts)); } catch (e) { console.warn(e); toast(`${isPdf(f) ? 'PDF' : 'Photo'} illisible${f.name ? ' : ' + f.name : ''}`); }
  }
  persist(); flushSave();
  if (Store.mode !== 'idb' && out.length) toast('Ce navigateur ne garde les photos que pendant la session');
  return out;
}
async function onCapture(input, hint) {

async function onAttach(input) {

function serviceRespect(v) {
  const svc = v.plan.find(p => p.code === 'service'); if (!svc) return null;
  const months = num(svc.months) || 12, kmI = num(svc.km) || 30000; const pts = kmPoints(v.id);
  const list = planDoneEvents(v, svc).sort((a, b) => a.date.localeCompare(b.date));
  const kmOf = e => { const k = num(e.km) ?? kmAt(v.id, e.date, pts); return k == null ? null : Math.round(k); };
  let ok = 0, late = 0, sd = 0, sk = 0, nk = 0;
  for (let i = 1; i < list.length; i++) {

function drawEntretien(vids, P) {

    r.evs.forEach(e => {

/* Courbe générique : points datés par voiture, lignes de repère facultatives */
function drawLines(box, lg, series, o) {

  const all = series.flatMap(s => s.pts);
  const W = Math.max(280, Math.floor(box.clientWidth)), H = 200, m = { l: 38, r: 10, t: 12, b: 24 };
  let x0 = Math.min(...all.map(p => p.d)), x1 = Math.max(...all.map(p => p.d)); if (x1 - x0 < 30) { x0 -= 15; x1 += 15; }
  const ys = all.map(p => p.y).concat((o.refs || []).map(r => r[0]));
  const sc = niceScale(o.lo != null ? o.lo : Math.min(...ys) - (o.dec >= 2 ? 0.02 : 0.2), o.hi != null ? Math.max(o.hi, ...ys) : Math.max(...ys) + (o.dec >= 2 ? 0.02 : 0.2), 4);
  const X = d => m.l + (d - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (sc.hi - v) / (sc.hi - sc.lo) * (H - m.t - m.b);

  g += monthTicks(x0, x1, Math.floor((W - m.l - m.r) / 62)).map(t => `<text x="${X(t.d).toFixed(1)}" y="${H - 6}" text-anchor="middle">${t.label}</text>`).join('');
  (o.refs || []).forEach(([v, l]) => { g += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${W - m.r}" y="${(Y(v) - 5).toFixed(1)}" text-anchor="end">${esc(l)}</text>`; });
  const tips = []; let lines = '', dots = '';

    for (const p of s.pts) {
      const cx = X(p.d).toFixed(1), cy = Y(p.y).toFixed(1); const ti = tips.push(p.tip) - 1;
      dots += `<circle class="dotmark" cx="${cx}" cy="${cy}" r="${s.dash ? 3 : 4.5}" fill="${col}"/><circle class="hot-dot" cx="${cx}" cy="${cy}" r="11" data-ti="${ti}" tabindex="0" role="img" aria-label="${esc(nameOf(s))}, ${esc(p.aria || '')}"/>`;
    }
  }
  TIPS[box.id] = tips;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(o.aria || '')}">${g}${lines}${dots}</svg><div class="tip" hidden></div>`;
  bindTips(box);
}
</script>

<script>
/* ============ Données de référence (intégrées : fonctionnent hors ligne) ============ */
/* Prix moyens annuels de vente au détail en métropole, €/L (Insee, séries 010596133 SP95-E10, 010533882 SP95, 010533883 gazole ;
   2026 : année en cours). SP95-E10 avant 2019 : SP95 moins 2 centimes (écart constaté 2019-2021) ; 2020 SP95 et gazole : déduits du SP95-E10. */
const FUEL_YEARLY = {

};
const FUEL_DERIVED = { 'SP95-E10': [2014, 2015, 2016, 2017, 2018], 'SP95': [2020], 'Gazole': [2020] };
/* Indice des prix harmonisé « assurance liée au transport », France, base 2015 = 100, mensuel 2014-2025 (Eurostat, via FRED série CP1254FRM086NEST ; Insee 001762478) */
const INS_IDX_START = 2014;
const INS_IDX = [95.57, 98.64, 99.10, 98.77, 98.77, 98.67, 99.15, 99.20, 99.18, 96.76, 96.65, 99.10,

  102.27, 103.12, 106.77, 105.54, 106.97, 106.94, 106.86, 106.97, 106.98, 105.39, 105.36, 108.53,
  106.97, 107.32, 109.71, 109.17, 109.20, 110.21, 110.16, 110.11, 110.02, 107.22, 107.29, 112.00,

  111.31, 112.08, 112.19, 115.08, 115.58, 114.25, 115.58, 115.65, 115.32, 114.53, 117.14, 118.77,

const INS_IDX_LAST = (() => { const n = INS_IDX.length - 1; return `${INS_IDX_START + Math.floor(n / 12)}-${pad(n % 12 + 1)}`; })();
/* Indice d'une année : moyenne des 12 mois ; au-delà de la dernière publication, la dernière moyenne connue */
function insIdxYear(y) {
  const last = INS_IDX_START + Math.floor((INS_IDX.length - 1) / 12);
  const yy = Math.max(INS_IDX_START, Math.min(last, y)); const a = (yy - INS_IDX_START) * 12; const s = INS_IDX.slice(a, a + 12);
  return s.reduce((x, v) => x + v, 0) / s.length;
}
/* Valeur à une date : moyennes annuelles placées au milieu de chaque année, interpolées entre elles */
const insIdxAt = date => { const u = Number(date.slice(0, 4)) + (Number(date.slice(5, 7)) - 0.5) / 12 - 0.5; const y0 = Math.floor(u), f = u - y0; return insIdxYear(y0) * (1 - f) + insIdxYear(y0 + 1) * f; };
function natFuelPrice(fuel, y) {
  const t = FUEL_YEARLY[fuel] || (fuel === 'SP98' ? FUEL_YEARLY.SP95 : null); if (!t) return null;
  const ys = Object.keys(t).map(Number); const yy = Math.max(Math.min(...ys), Math.min(Math.max(...ys), y));
  return t[yy] * (fuel === 'SP98' ? 1.05 : 1);

/* ============ Estimations ============ */
const estOn = () => !!(D && D.settings && D.settings.estimate);
/* Prix payé comparé à la moyenne nationale, sur les pleins suivis (au moins 3) : corrige l'estimation (borné à ±15 %) */
function priceRatio(v) {
  return memo('pr:' + v.id, () => {
    const tf = trackFrom(v); if (!tf) return { r: 1, n: 0 };
    const pl = D.events.filter(e => e.vehicleId === v.id && e.type === 'plein' && e.date >= tf && num(e.litres) > 0 && num(e.prix) > 0);
    let a = 0, b = 0; pl.forEach(e => { const nat = natFuelPrice(e.carburant || v.carburant, Number(e.date.slice(0, 4))); if (!nat) return; a += num(e.litres) * num(e.prix); b += num(e.litres) * nat; });

  return rows.map(r => { r.parts.sort((a, b) => a.x - b.x); let out = '', end = null; r.parts.forEach(p => { if (end != null) out += p.x - end > 12 ? '   ' : p.x - end > 1.5 ? ' ' : ''; out += p.s; end = p.x + p.w; }); return out.replace(/\s+$/, ''); });
}
async function pdfRead(file) {
  const lib = await loadPdfJs(); const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await lib.getDocument({ data, isEvalSupported: false }).promise;
  const n = pdf.numPages; const lines = [];
  for (let i = 1; i <= Math.min(n, 6); i++) { const pg = await pdf.getPage(i); const tc = await pg.getTextContent(); if (i > 1) lines.push(''); lines.push(...pdfLines(tc.items)); }
  const page = await pdf.getPage(1); const vp0 = page.getViewport({ scale: 1 }); const scale = Math.min(3, 1800 / Math.max(vp0.width, vp0.height)); const vp = page.getViewport({ scale });
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  try { await pdf.destroy(); } catch (e) { /* rien */ }
  return { canvas: c, text: lines.join('\n'), pages: n };
}

/* ============ Factures et carnet : compléter au lieu de dupliquer ============ */
function mergeCandidate(vid, type, date, selfId) {
  if (!['entretien', 'reparation'].includes(type) || !vid || !validDate(date)) return null;
  const c = D.events.filter(e => e.vehicleId === vid && e.type === 'entretien' && e.id !== selfId && validDate(e.date) && Math.abs(diffDays(e.date, date)) <= 10 && num(e.montant) == null)
    .sort((a, b) => Math.abs(diffDays(a.date, date)) - Math.abs(diffDays(b.date, date)));
  return c[0] || null;
}
function mergeBox(vid, type, date, selfId) {
  const c = mergeCandidate(vid, type, date, selfId); if (!c) return '';
  return `<label class="check merge"><input type="checkbox" name="mergeInto" value="${c.id}" checked><span>Compléter « ${esc(eventTitle(c))} » du ${fmtDate(c.date)}, déjà noté sans montant<br><span class="hint">Montant, garage, opérations et photo s’y ajoutent : pas de doublon.</span></span></label>`;
}

/* ============ Divers ============ */
async function storageLine() {
  const el = $('#storage-line'); if (!el) return;
  try { const e = await navigator.storage.estimate(); el.textContent = `Espace utilisé sur cet appareil : ${fmtN((e.usage || 0) / 1048576, 1)} Mo${Store.persisted ? ', stockage protégé contre l’effacement automatique' : ''}.`; } catch (err) { el.textContent = ''; }
}
async function takeShared() {
  if (!/[?&]partage=/.test(location.search) || !window.caches) return;
  try {
    const c = await caches.open('carnet-auto-share'); const keys = await c.keys(); const files = [];
    for (const k of keys) { const r = await c.match(k); if (!r) continue; const b = await r.blob(); const name = decodeURIComponent(r.headers.get('X-Name') || 'partage'); files.push(new File([b], name, { type: b.type || r.headers.get('Content-Type') || '' })); await c.delete(k); }
    history.replaceState(null, '', location.pathname);
    if (files.length) { go('docs', { df: 'inbox', dv: null }); await ingestFiles(files); rerender(); Queue.kick(); toast(files.length > 1 ? `${files.length} documents reçus` : 'Document reçu'); }
  } catch (e) { console.warn('Partage', e); }
}

<script>
/* ============ Graphiques (SVG dessinés à la main) ============ */
const TIPS = {};
const emptyChart = msg => `<div class="empty">${msg}</div>`;
function niceScale(min, max, count) {
  if (!(max > min)) max = min + 1;
  const raw = (max - min) / count; const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step; const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { lo, hi, ticks, step };
}
function monthTicks(x0, x1, maxN) {
  const a = fromDayNum(x0), b = fromDayNum(x1);
  let k = a.slice(8) === '01' ? a : addMonths(a.slice(0, 7) + '-01', 1);
  const all = []; let g = 0; while (k <= b && g++ < 600) { all.push(k); k = addMonths(k, 1); }
  const need = Math.max(1, Math.ceil(all.length / Math.max(1, maxN)));
  const st = [1, 2, 3, 4, 6, 12].find(s => s >= need) || 12;
  return all.filter(k => (Number(k.slice(5, 7)) - 1) % st === 0).map((k, i) => {
    const m = Number(k.slice(5, 7)); return { d: dayNum(k), label: MONTHS[m - 1] + (m === 1 || i === 0 ? ' ' + k.slice(2, 4) : '') };
  });
}
const topBar = (x, y, w, h, r = 4) => { r = Math.max(0, Math.min(r, w / 2, h)); return `M${x.toFixed(1)},${(y + h).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + r).toFixed(1)},${y.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)},${y.toFixed(1)} ${(x + w).toFixed(1)},${(y + r).toFixed(1)}V${(y + h).toFixed(1)}Z`; };
function bindTips(box) {
  const tip = box.querySelector('.tip'); if (!tip) return;
  const hide = () => { tip.hidden = true; box.querySelectorAll('.hot').forEach(n => n.classList.remove('hot')); };
  const show = (el, evt) => {
    hide(); const list = TIPS[box.id] || []; tip.innerHTML = list[Number(el.dataset.ti)] || ''; tip.hidden = false; el.classList.add('hot');
    const br = box.getBoundingClientRect(); let x, y;
    if (evt && evt.pointerType === 'mouse') { x = evt.clientX - br.left; y = evt.clientY - br.top; }
    else { const r = el.getBoundingClientRect(); x = r.left + r.width / 2 - br.left; y = r.top - br.top + Math.min(r.height / 2, 20); }
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(0, Math.min(br.width - tw, x - tw / 2)) + 'px';
    tip.style.top = (y - th - 12 < -8 ? y + 16 : y - th - 12) + 'px';
  };
  box.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest('[data-ti]'); if (el) show(el, e); else hide(); });
  box.addEventListener('pointerdown', e => { const el = e.target.closest('[data-ti]'); if (el) show(el, e); else hide(); });
  box.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  box.addEventListener('focusin', e => { const el = e.target.closest('[data-ti]'); if (el) show(el); });
  box.addEventListener('focusout', hide);
}
function buckets(P) {
  const months = monthsBetween(P.from, P.to);
  if (months.length <= 24) return months.map(k => ({ from: k, to: k, label: MONTHS[Number(k.slice(5)) - 1], full: monthLabelFull(k) }));
  return [...new Set(months.map(k => k.slice(0, 4)))].map(y => ({ from: y + '-01', to: y + '-12', label: y, full: 'Année ' + y }));
}
function drawCharts() { const vids = statsVids(), P = periodRange(U.sp); drawConso(vids, P); drawCost(vids, P); drawSplit(vids, P); drawKm(vids, P); drawPrix(vids, P); drawEntretien(vids, P); drawDepth(vids); drawPrimes(vids); }

function drawConso(vids, P) {
  const box = $('#ch-conso'), lg = $('#lg-conso'); if (!box) return;
  const series = vids.map(id => ({ v: veh(id), segs: trackedSegs(id).filter(s => s.date >= P.from && s.date <= P.to) })).filter(s => s.segs.length);
  const all = series.flatMap(s => s.segs);
  if (!all.length) { box.innerHTML = emptyChart('Il faut au moins deux pleins complets avec kilométrage sur la période.'); lg.innerHTML = ''; return; }
  const ref = vids.length === 1 ? num(veh(vids[0]).tech.wltp) : null;
  lg.innerHTML = series.length > 1 ? series.map(s => `<span><i style="background:${s.v.couleur}"></i>${esc(s.v.surnom)}</span>`).join('') : '';
  const W = Math.max(280, Math.floor(box.clientWidth)), H = 220, m = { l: 34, r: 10, t: 14, b: 24 };
  let x0 = Math.min(...all.map(s => dayNum(s.date))), x1 = Math.max(...all.map(s => dayNum(s.date)));
  if (x1 - x0 < 30) { x0 -= 15; x1 += 15; }
  const vals = all.filter(s => !s.out).map(s => s.conso).concat(ref ? [ref] : []); if (!vals.length) vals.push(...all.map(s => s.conso));
  const sc = niceScale(Math.min(...vals) - 0.2, Math.max(...vals) + 0.2, 4);
  const X = d => m.l + (d - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (sc.hi - v) / (sc.hi - sc.lo) * (H - m.t - m.b);
  const dec = sc.step < 1 ? 1 : 0;
  let g = sc.ticks.map(t => `<line class="${t === sc.lo ? 'base' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${m.l - 6}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmtN(t, dec)}</text>`).join('');
  g += monthTicks(x0, x1, Math.floor((W - m.l - m.r) / 62)).map(t => `<text x="${X(t.d).toFixed(1)}" y="${H - 6}" text-anchor="middle">${t.label}</text>`).join('');
  if (ref) g += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${Y(ref).toFixed(1)}" y2="${Y(ref).toFixed(1)}"/><text x="${W - m.r}" y="${(Y(ref) - 5).toFixed(1)}" text-anchor="end">Constructeur ${fmtN(ref, 1)}</text>`;
  const tips = []; let lines = '', dots = '';
  for (const s of series) {
    const col = s.v.couleur;
    const okS = s.segs.filter(x => !x.out); const pts = okS.map((seg, i) => [X(dayNum(seg.date)), Y(weighted(okS.slice(Math.max(0, i - 4), i + 1)))]);
    if (pts.length > 1) lines += `<path d="M${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (const seg of s.segs) {
      const cx = X(dayNum(seg.date)).toFixed(1), cy = Y(Math.max(sc.lo, Math.min(sc.hi, seg.conso))).toFixed(1);
      if (seg.out) { const ti = tips.push(`${fmtDate(seg.date)} · ${esc(s.v.surnom)}<br><b>${fmtN(seg.conso, 1)} L/100 km, écarté</b><br>${esc(seg.out)}`) - 1; dots += `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--surface)" stroke="${col}" stroke-width="1.5" stroke-dasharray="2 2"/><circle class="hot-dot" cx="${cx}" cy="${cy}" r="11" data-ti="${ti}" tabindex="0" role="img" aria-label="${fmtDate(seg.date)}, ${esc(s.v.surnom)} : intervalle écarté"/>`; continue; }
      const ti = tips.push(`${fmtDate(seg.date)} · ${esc(s.v.surnom)}<br><b>${fmtN(seg.conso, 1)} L/100 km</b><br>${fmtN(seg.km)} km · ${fmtN(seg.litres, 1)} L`) - 1;
      dots += `<circle class="dotmark" cx="${cx}" cy="${cy}" r="4" fill="${col}" fill-opacity="0.55"/><circle class="hot-dot" cx="${cx}" cy="${cy}" r="11" data-ti="${ti}" tabindex="0" role="img" aria-label="${fmtDate(seg.date)}, ${esc(s.v.surnom)} : ${fmtN(seg.conso, 1)} litres aux 100 kilomètres"/>`;
    }
  }
  TIPS['ch-conso'] = tips;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Consommation par plein">${g}${lines}${dots}</svg><div class="tip" hidden></div>`;
  bindTips(box);
}

function drawCost(vids, P) {
  const box = $('#ch-cost'), lg = $('#lg-cost'); if (!box) return;
  const bs = buckets(P); const allocs = costInAll(vids, P.from.slice(0, 7), P.to.slice(0, 7));
  const data = bs.map(b => { const parts = {}, ests = {}; GROUPS.forEach(gr => { parts[gr.id] = 0; ests[gr.id] = 0; }); allocs.forEach(a => { if (a.month >= b.from && a.month <= b.to) { parts[a.group] += a.amount; if (a.est) ests[a.group] += a.amount; } }); return Object.assign({}, b, { parts, ests, total: Object.values(parts).reduce((s, x) => s + x, 0), est: Object.values(ests).reduce((s, x) => s + x, 0) }); });
  const max = Math.max(0, ...data.map(d => d.total));
  if (!(max > 0)) { box.innerHTML = emptyChart('Aucune dépense sur la période.'); lg.innerHTML = ''; return; }
  const present = GROUPS.filter(gr => data.some(d => d.parts[gr.id] > 0));
  const anyEst = data.some(d => d.est > 0.5);
  lg.innerHTML = present.map(gr => `<span><i style="background:${gr.color}"></i>${gr.label}</span>`).join('') + (anyEst ? `<span><i class="hatch-key"></i>Estimé</span>` : '');
  const W = Math.max(280, Math.floor(box.clientWidth)), H = 230, m = { l: 50, r: 6, t: 10, b: 24 };
  const sc = niceScale(0, max, 4); const n = data.length; const band = (W - m.l - m.r) / n; const bw = Math.max(4, Math.min(24, band * 0.62));
  const Y = v => m.t + (sc.hi - v) / (sc.hi - sc.lo) * (H - m.t - m.b);
  let g = sc.ticks.map(t => `<line class="${t === 0 ? 'base' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${m.l - 6}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmtN(t)} €</text>`).join('');
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor((W - m.l - m.r) / 38))));
  const tips = []; let bars = '', hits = '';
  data.forEach((d, i) => {
    const cx = m.l + band * (i + 0.5), x = cx - bw / 2;
    const segs = present.flatMap(gr => [[gr, d.parts[gr.id] - d.ests[gr.id], false], [gr, d.ests[gr.id], true]]).filter(x => x[1] > 0.005); let base = Y(0);
    segs.forEach(([gr, val, isEst], j) => {
      const h = Y(0) - Y(val); const top = base - h; const isTop = j === segs.length - 1;
      const drawH = isTop ? h : Math.max(0, h - 2);
      const fill = isEst ? `url(#hatch-${gr.id})` : gr.color;
      if (drawH > 0.3) bars += isTop ? `<path d="${topBar(x, top, bw, drawH)}" fill="${fill}"/>` : `<rect x="${x.toFixed(1)}" y="${(top + 2).toFixed(1)}" width="${bw.toFixed(1)}" height="${drawH.toFixed(1)}" fill="${fill}"/>`;
      base = top;
    });
    if (i % every === 0) g += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${d.label}</text>`;
    const grs = present.filter(gr => d.parts[gr.id] > 0.005);
    const ti = tips.push(`${esc(d.full)}<br><b>${d.est > 0.5 ? '≈ ' : ''}${fmtEur(d.total)}</b>${d.est > 0.5 ? ` dont ${fmtEur(d.est)} estimés` : ''}` + grs.slice().reverse().map(gr => `<br><i style="background:${gr.color}"></i>${gr.label} : ${fmtEur(d.parts[gr.id])}${d.ests[gr.id] > 0.5 ? ' (estimé)' : ''}`).join('')) - 1;
    hits += `<rect class="hit" x="${(m.l + band * i).toFixed(1)}" y="${m.t}" width="${band.toFixed(1)}" height="${H - m.t - m.b}" data-ti="${ti}" tabindex="0" role="img" aria-label="${esc(d.full)} : ${fmtEur(d.total)}"/>`;
  });
  TIPS['ch-cost'] = tips;
  const defs = `<defs>${GROUPS.map(gr => `<pattern id="hatch-${gr.id}" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:${gr.color};opacity:.28"/><rect width="2.6" height="6" style="fill:${gr.color}"/></pattern>`).join('')}</defs>`;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Dépenses">${defs}${hits}${g}${bars}</svg><div class="tip" hidden></div>`;
  bindTips(box);
}

function drawSplit(vids, P) {
  const box = $('#ch-split'); if (!box) return;
  const tot = {}, subs = {}, estT = {};
  trackedStats(vids, P.from, P.to).allocs.forEach(a => { tot[a.group] = (tot[a.group] || 0) + a.amount; if (a.est) estT[a.group] = (estT[a.group] || 0) + a.amount; const k = a.group + '|' + (a.sub || ''); subs[k] = (subs[k] || 0) + a.amount; });
  const rows = GROUPS.map(gr => Object.assign({}, gr, { v: tot[gr.id] || 0 })).filter(r => r.v > 0.005).sort((a, b) => b.v - a.v);
  if (!rows.length) { box.innerHTML = emptyChart('La répartition s’affiche à partir du premier plein saisi.'); return; }
  const sum = rows.reduce((s, r) => s + r.v, 0), max = rows[0].v;
  const detail = gid => { const parts = Object.entries(subs).filter(([k, v]) => k.startsWith(gid + '|') && v > 0.5).map(([k, v]) => [k.split('|')[1], v]).sort((a, b) => b[1] - a[1]); return parts.length > 1 ? parts.slice(0, 3).map(([l, v]) => `${l} ${fmtEur(v)}`).join(' · ') : ''; };
  box.innerHTML = `<div class="hbars">${rows.map(r => { const d = detail(r.id); return `<div class="hitem"><div class="hrow"><span class="hlab"><span><i style="background:${r.color}"></i>${r.label}</span></span><span aria-hidden="true"><span class="hseg2" style="width:${(r.v / max * 100).toFixed(1)}%">${r.v - (estT[r.id] || 0) > 0.5 ? `<i style="flex:${r.v - (estT[r.id] || 0)};background:${r.color}"></i>` : ''}${(estT[r.id] || 0) > 0.5 ? `<i class="est" style="flex:${estT[r.id]};--hc:${r.color}"></i>` : ''}</span></span><span class="hval">${(estT[r.id] || 0) > 0.5 ? '≈ ' : ''}${fmtEur(r.v)}<small>${fmtN(r.v / sum * 100)} %</small></span></div>${d ? `<small class="hdet">dont ${esc(d)}</small>` : ''}</div>`; }).join('')}</div>`;
}

function drawKm(vids, P) {
  const box = $('#ch-km'), lg = $('#lg-km'); if (!box) return;
  const vs = vids.map(veh); const bs = buckets(P);
  const data = bs.map(b => Object.assign({}, b, { vals: vids.map(id => kmDriven(id, b.from + '-01', monthEnd(b.to))) }));
  const max = Math.max(0, ...data.flatMap(d => d.vals));
  if (!(max > 0)) { box.innerHTML = emptyChart('Il faut au moins deux kilométrages saisis.'); lg.innerHTML = ''; return; }
  lg.innerHTML = vs.length > 1 ? vs.map(v => `<span><i style="background:${v.couleur}"></i>${esc(v.surnom)}</span>`).join('') : '';
  const W = Math.max(280, Math.floor(box.clientWidth)), H = 200, m = { l: 46, r: 6, t: 10, b: 24 };
  const sc = niceScale(0, max, 4); const n = data.length, nv = vs.length; const band = (W - m.l - m.r) / n;
  const groupW = Math.min(band * 0.74, nv * 24 + (nv - 1) * 2); const bw = Math.max(2, (groupW - (nv - 1) * 2) / nv);
  const Y = v => m.t + (sc.hi - v) / (sc.hi - sc.lo) * (H - m.t - m.b);
  let g = sc.ticks.map(t => `<line class="${t === 0 ? 'base' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${m.l - 6}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${fmtN(t)}</text>`).join('');
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor((W - m.l - m.r) / 38))));
  const tips = []; let bars = '', hits = '';
  data.forEach((d, i) => {
    const cx = m.l + band * (i + 0.5); const x0 = cx - groupW / 2;
    d.vals.forEach((val, j) => { const h = Y(0) - Y(val); if (h > 0.3) bars += `<path d="${topBar(x0 + j * (bw + 2), Y(val), bw, h)}" fill="${vs[j].couleur}"/>`; });
    if (i % every === 0) g += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${d.label}</text>`;
    const ti = tips.push(`${esc(d.full)}` + d.vals.map((val, j) => `<br><i style="background:${vs[j].couleur}"></i>${esc(vs[j].surnom)} : <b>${fmtN(val)} km</b>`).join('')) - 1;
    hits += `<rect class="hit" x="${(m.l + band * i).toFixed(1)}" y="${m.t}" width="${band.toFixed(1)}" height="${H - m.t - m.b}" data-ti="${ti}" tabindex="0" role="img" aria-label="${esc(d.full)} : ${d.vals.map((val, j) => esc(vs[j].surnom) + ' ' + fmtN(val) + ' km').join(', ')}"/>`;
  });
  TIPS['ch-km'] = tips;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Kilomètres par mois">${hits}${g}${bars}</svg><div class="tip" hidden></div>`;
  bindTips(box);
}

/* ============ Fichiers : sauvegarde (avec photos), CSV, agenda ============ */
async function saveFile(filename, data, mime) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename, data }); return 'saved'; }
    }
  } catch (err) {
    const c = err && err.code;
    if (c === 'declined') return 'declined';
    if (c === 'rate_limited') { toast('Une confirmation est déjà ouverte'); return 'declined'; }
    if (c === 'rejected_extension' || c === 'extension_not_enabled') return 'rejected';
    if (c === 'too_large') { toast('Fichier trop lourd pour cette vue : décoche les photos'); return 'declined'; }
  }
  try {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return 'saved';

    D.events.push({ id: uid(), created: Date.now(), vehicleId: v.id, type: 'pneus', op: 'controle', date: todayStr(), pression: true, prof: {}, montant: null, libelle: '', notes: '' });
    persist(); closeSheet(); rerender(); toast('Contrôle de pression noté');
  },
  'edit-event': el => { U.armed = null; openEventForm({ id: el.dataset.id }); },
  'close-sheet': () => { saveDraftIfDoc(); closeSheet(); if (U.view === 'docs' || U.view === 'home') rerender(); },
  'del-event': el => armOrRun(el, 'ev:' + el.dataset.id, 'Confirmer', () => {
    const id = el.dataset.id; D.events = D.events.filter(e => e.id !== id);
    D.events.forEach(r => { if (r.type === 'remarque' && r.resolBy === id) { r.resolBy = null; if (r.statut === 'resolu') r.resolNote = r.resolNote || 'Saisie liée supprimée'; } });
    D.docs.forEach(x => { if (x.eventId === id) { x.status = 'kept'; x.eventId = null; } });
    persist(); closeSheet(); rerender(); toast('Saisie supprimée');
  }),
  'remove-demo': () => { removeDemo(); persist(); rerender(); toast('Exemples retirés'); },
  'load-demo': () => { loadDemo(); persist(); rerender(); toast('Exemples chargés'); },
  jv: el => { U.jv = el.dataset.v; rerender(); },
  sv: el => { U.sv = el.dataset.v; rerender(); },
  'set-color': el => setColor(el.dataset.hex),
  'add-plan': () => { const v = veh(U.vid); const it = newPlanItem('Nouvel élément'); const ci = v.plan.findIndex(p => p.cat === 'nettoyage'); if (ci >= 0) v.plan.splice(ci, 0, it); else v.plan.push(it); persist(); rerender(); openPlanItem(it.id); },
  'plan-edit': el => { U.armed = null; openPlanItem(el.dataset.id); },
  'del-plan': el => armOrRun(el, 'plan:' + el.dataset.id, 'Confirmer', () => { const v = veh(U.vid); v.plan = v.plan.filter(p => p.id !== el.dataset.id); persist(); closeSheet(); rerender(); toast('Élément retiré'); }),
  'plan-reset': el => armOrRun(el, 'plan-reset', 'Confirmer', () => {
    const v = veh(U.vid);
    OPEL_PLAN.forEach(def => { const it = v.plan.find(p => p.code === def.code); if (it) { it.km = def.km || null; it.months = def.months || null; } else v.plan.push(newPlanFrom(def, true)); });
    upgradePlan(v, D); persist(); rerender(); toast('Intervalles Opel rétablis');
  }),
  'clean-done': el => {
    const v = veh(el.dataset.vid); if (!v) return;
    D.events.push({ id: uid(), created: Date.now(), vehicleId: v.id, type: 'nettoyage', date: todayStr(), ops: [el.dataset.op], montant: null, libelle: '', notes: '' });
    persist(); closeSheet(); rerender(); const it = v.plan.find(p => p.id === el.dataset.op); toast(`${it ? it.label : 'Nettoyage'} noté`);
  },
  'add-clean': el => { closeSheet(); openEventForm({ type: 'nettoyage', vid: el.dataset.vid, op: el.dataset.op }); },
  'tick-planned': el => {
    const f = el.closest('form'); const r = f && f.querySelector('input[name="vehicleId"]:checked'); const v = r && veh(r.value); if (!v) return;
    const next = (programFor(v, 1).list || [])[0]; if (!next) { toast('Programme inconnu : saisis d’abord un service'); return; }
    const ids = new Set(next.ops.map(o => o.id)); let n = 0;
    $$('input[name="ops"]', f).forEach(cb => { if (ids.has(cb.value) && !cb.checked) { cb.checked = true; n++; } });
    if (next.type) { const rb = f.querySelector(`input[name="service"][value="${next.type}"]`); if (rb) rb.checked = true; }
    toast(n ? `${n} opération${n > 1 ? 's' : ''} cochée${n > 1 ? 's' : ''} : vérifie avec le carnet` : 'Déjà cochées');
  },
  'add-reminder': () => { closeSheet(); openReminderForm(U.view === 'vehicle' ? U.vid : null); },
  'ech-open': el => openEchSheet(el.dataset.key, el.dataset.vid),
  'ech-do': el => echDo(el.dataset),
  'ech-plan': el => { closeSheet(); go('vehicle', { vid: el.dataset.vid, tab: 'entretien' }); },
  'export-json': () => exportJson(),
  'export-csv': () => exportCsv(),
  'csv-template': () => csvTemplate(),
  'export-ics': () => exportIcs(),
  copy: el => copyText(el.dataset.text, el),
  'clear-all': el => armOrRun(el, 'clear', 'Confirmer : tout effacer', async () => {
    D = freshData(); await Store.clearFiles(); THUMBS.forEach(u => URL.revokeObjectURL(u)); THUMBS.clear(); persist(); go('home'); toast('Données effacées');
  }),
  'add-vehicle': () => {
    const used = D.vehicles.map(v => v.couleur); const col = (PALETTE.find(p => !used.includes(p.hex)) || PALETTE[0]).hex;
    const v = newVehicle({ surnom: 'Nouvelle voiture', couleur: col }); D.vehicles.push(v); persist(); go('vehicle', { vid: v.id, tab: 'identite' });
  },
  'del-vehicle': el => armOrRun(el, 'veh:' + el.dataset.id, 'Confirmer la suppression', () => {
    const id = el.dataset.id; const evIds = new Set(D.events.filter(e => e.vehicleId === id).map(e => e.id));
    D.vehicles = D.vehicles.filter(v => v.id !== id); D.events = D.events.filter(e => e.vehicleId !== id); D.reminders = D.reminders.filter(r => r.vehicleId !== id);
    D.docs.forEach(x => { if (x.vehicleId === id) x.vehicleId = null; if (evIds.has(x.eventId)) { x.status = 'kept'; x.eventId = null; } });
    persist(); go('home'); toast('Voiture supprimée');
  }),
  'confirm-restore': () => confirmRestore(),
  'confirm-import': () => { if (!pendingImport || !pendingImport.length) return; D.events.push(...pendingImport); const n = pendingImport.length; pendingImport = null; persist(); closeSheet(); go('journal'); toast(`${n} lignes importées`); },
  /* Documents */
  'open-doc': el => openDoc(el.dataset.id),
  'view-doc': el => openViewer(el.dataset.id),
  'close-viewer': () => closeViewer(),
  'zoom-viewer': el => el.classList.toggle('zoom'),
  'doc-type': el => {
    const f = el.closest('form'); const doc = f && docById(f.dataset.doc); if (!doc) return;
    if (f.elements.date) doc.draft = formValues(f);
    doc.type = el.dataset.type; persist();
    const s0 = $('.sheet'); const y = s0 ? s0.scrollTop : 0; openEventForm({ docId: doc.id }); const s = $('.sheet'); if (s) s.scrollTop = y;
  },
  'doc-reread': el => { const doc = docById(el.dataset.id); if (!doc) return; doc.status = 'queued'; doc.want = 'contrast'; persist(); Queue.kick(); openEventForm({ docId: doc.id }); },
  'doc-ai': el => { const doc = docById(el.dataset.id); if (!doc || !AI.available()) return; doc.status = 'queued'; doc.want = 'claude'; persist(); Queue.kick(); openEventForm({ docId: doc.id }); },
  'ai-batch': () => {
    if (!AI.available()) return;
    const all = D.docs.filter(x => x.status === 'inbox' && x.engine !== 'claude'); const list = all.slice(0, 20);
    list.forEach(x => { x.status = 'queued'; x.want = 'claude'; }); persist(); Queue.kick(); rerender();
    toast(`${list.length} document${list.length > 1 ? 's' : ''} envoyé${list.length > 1 ? 's' : ''} à Claude${all.length > list.length ? ' (les 20 premiers)' : ''}`);
  },
  'doc-keep': el => { const doc = docById(el.dataset.id); if (!doc) return; doc.status = 'kept'; delete doc.draft; persist(); closeSheet(); rerender(); toast('Photo gardée sans saisie'); },
  'doc-del': el => armOrRun(el, 'doc:' + el.dataset.id, 'Confirmer la suppression', async () => { await deleteDoc(el.dataset.id); closeSheet(); rerender(); toast('Document supprimé'); }),
  'doc-make': el => { const doc = docById(el.dataset.id); if (!doc) return; doc.status = 'inbox'; persist(); openEventForm({ docId: doc.id }); },
  tok: el => placeToken(el.dataset.v),
  'ocr-warm': () => { if (OCR.state === 'failed') OCR.state = 'idle'; OCR.ensure().then(() => { if (U.view === 'reglages') rerender(); toast('Moteur de lecture prêt'); }, () => { if (U.view === 'reglages') rerender(); toast('Le moteur de lecture ne démarre pas ici'); }); rerender(); }
};

document.addEventListener('click', ev => {
  const lab = ev.target.closest('[data-attach-ev]'); if (lab) attachTarget = lab.dataset.attachEv;
  const el = ev.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (a === 'scrim') { if (ev.target === el) { saveDraftIfDoc(); closeSheet(); } return; }
  if (el.disabled) return;
  const fn = ACTIONS[a]; if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'cap-photo') { onCapture(t, null); return; }
  if (t.id === 'cap-multi') { onCapture(t, null); return; }
  if (t.id === 'cap-km') { onCapture(t, 'km'); return; }
  if (t.id === 'cap-attach' || t.id === 'cap-attach-cam') { onAttach(t); return; }
  if (t.dataset.vf) {
    const v = veh(U.vid); if (!v) return;
    let val = t.value;
    if (t.dataset.num) val = num(val); else { val = val.trim(); if (t.dataset.upper) { val = val.toUpperCase(); t.value = val; } }
    setPath(v, t.dataset.vf, val === '' ? null : val); persist(); toast('Enregistré');
    if (t.dataset.vf === 'surnom' && $('#vh-eyebrow')) $('#vh-eyebrow').textContent = v.surnom || 'Sans nom';
    if (t.dataset.vf.startsWith('assurance.') || t.dataset.vf === 'cg.B' || t.dataset.vf === 'tech.wltp' || t.dataset.vf === 'suivi') rerenderKeepFocus();
    return;
  }
  if (t.dataset.color) { setColor(t.value); return; }
  if (t.dataset.plan) {
    const v = veh(U.vid); const it = v && v.plan.find(p => p.id === t.dataset.plan); if (!it) return;
    const f = t.dataset.pf;
    if (f === 'label') it.label = t.value.trim() || 'Élément'; else if (f === 'lastDate') it.lastDate = validDate(t.value) ? t.value : null; else it[f] = num(t.value);
    persist(); rerenderKeepFocus(); toast('Enregistré'); return;
  }
  if (t.dataset.setting) { const n = num(t.value); if (n != null) D.settings[t.dataset.setting] = Math.max(0, Math.round(n)); t.value = D.settings[t.dataset.setting]; persist(); toast('Enregistré'); return; }
  if (t.dataset.settingBool) { D.settings[t.dataset.settingBool] = t.checked; persist(); toast('Enregistré'); return; }
  if (t.dataset.filter === 'jt') { U.jt = t.value; rerender(); return; }
  if (t.dataset.filter === 'sp') { U.sp = t.value; D.settings.statsPeriod = t.value; persist(); rerender(); return; }
  if (t.dataset.statRange) { if (validDate(t.value)) { D.settings[t.dataset.statRange] = t.value; persist(); rerender(); } return; }
  if (t.dataset.crmYear) { const v = veh(t.dataset.vid); if (!v) return; v.assurance.crmByYear = v.assurance.crmByYear || {}; const n = num(t.value); if (n == null) delete v.assurance.crmByYear[t.dataset.crmYear]; else if (n >= 0.5 && n <= 3.5) v.assurance.crmByYear[t.dataset.crmYear] = n; else { toast('Un bonus-malus va de 0,50 à 3,50'); return; } persist(); rerenderKeepFocus(); toast('Enregistré'); return; }
  if (t.dataset.layOn) { const L = statsLayout(); const x = L.find(y => y.id === t.dataset.layOn); if (x) x.on = t.checked; D.settings.statsCards = L; persist(); if (U.view === 'stats') rerender(); return; }
  if (t.id === 'restore-file') { readFile(t, startRestore); return; }
  if (t.id === 'csv-file') { readFile(t, startCsvImport); return; }
  if (t.name === 'vehicleId' && t.form && ['entretien', 'reparation', 'nettoyage'].includes(t.form.dataset.type)) { const box = $('#ops-box'); if (box) box.innerHTML = opsList(t.value, [], null, t.form.dataset.type === 'nettoyage' ? 'nettoyage' : null); }
  if (t.form && t.form.dataset.type === 'remarque') {
    const f = t.form; const r = f.querySelector('input[name="vehicleId"]:checked'); const v = r && veh(r.value); const vals = formValues(f);
    vals.date = f.elements.date ? f.elements.date.value : null;
    if (v && (t.name === 'cat' || t.name === 'vehicleId')) { const box = $('#rq-box'); if (box) { if (t.name === 'cat') { delete vals.grav; delete vals.nature; } box.innerHTML = remarqueFields(vals.cat, v, vals, {}); } }
    if (v && (t.name === 'statut' || t.name === 'vehicleId')) { const box = $('#rq-res'); if (box) box.innerHTML = vals.statut === 'resolu' ? obsResolFields(v, Object.assign({}, vals, { resolBy: f.dataset.id ? (D.events.find(e => e.id === f.dataset.id) || {}).resolBy : null })) : ''; }
    if (t.name === 'couleur') { const g = f.querySelector(`input[name="grav"][value="${t.value === 'rouge' ? 'urgent' : t.value === 'orange' ? 'verifier' : 'surveiller'}"]`); if (g) g.checked = true; }
    if (t.name === 'voyant') { const def = (VOYANTS.find(x => x[0] === t.value) || [])[2]; const c = def && f.querySelector(`input[name="couleur"][value="${def}"]`); if (c && !f.querySelector('input[name="couleur"]:checked')) { c.checked = true; c.dispatchEvent(new Event('change', { bubbles: true })); } }
  }
  if (t.name === 'vehicleId' && t.form && ['reparation', 'entretien'].includes(t.form.dataset.type)) { const box = $('#obsfix-box'); if (box) box.innerHTML = obsFixBlock(t.value, t.form.dataset.id || null); }
  if ((t.name === 'vehicleId' || t.name === 'date') && t.form && ['reparation', 'entretien'].includes(t.form.dataset.type) && !t.form.dataset.id) { const box = $('#merge-box'); const r = t.form.querySelector('input[name="vehicleId"]:checked'); if (box && r) box.innerHTML = mergeBox(r.value, t.form.dataset.type, t.form.elements.date.value, null); }
  if (t.form && t.form.dataset.type === 'pneus' && (t.name === 'op' || t.name === 'vehicleId')) {
    const box = $('#pn-box'); const f = t.form; const r = f.querySelector('input[name="vehicleId"]:checked'); const v = r && veh(r.value); const opr = f.querySelector('input[name="op"]:checked');
    if (box && v && opr) { const vals = formValues(f); if (t.name === 'vehicleId') delete vals.setId; box.innerHTML = pneusFields(opr.value, v, vals, {}, !f.dataset.id); }
  }
  if (t.name === 'service' && t.form) { const cb = t.form.querySelector('input[name="ops"][data-code="service"]'); if (cb) cb.checked = t.value !== 'autre'; }
  if (t.classList && t.classList.contains('chk')) t.classList.remove('chk');
});
let jqTimer = null;
document.addEventListener('input', ev => {
  const t = ev.target; if (t.dataset && t.dataset.calc && t.form) calcPlein(t.form, t.dataset.calc);
  if (t.dataset && t.dataset.filter === 'jq') { clearTimeout(jqTimer); jqTimer = setTimeout(() => { U.jq = t.value; U.jlimit = 150; const pos = t.selectionStart; rerenderKeepFocus(); const n = $('#jq'); if (n && pos != null) n.setSelectionRange(pos, pos); }, 220); }
});
document.addEventListener('submit', ev => {
  const f = ev.target; if (!f.dataset || !f.dataset.form) return; ev.preventDefault();
  if (f.dataset.form === 'event') submitEvent(f); else if (f.dataset.form === 'reminder') submitReminder(f); else if (f.dataset.form === 'plan') submitPlanItem(f);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#viewer-root').firstChild) { closeViewer(); return; } if (sheetOpen()) { saveDraftIfDoc(); closeSheet(); } return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target instanceof SVGElement && ev.target.closest('[data-action]')) { ev.preventDefault(); ev.target.closest('[data-action]').dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  const lab = ev.target.closest && ev.target.closest('label[data-file]');
  if (lab && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); if (lab.dataset.attachEv) attachTarget = lab.dataset.attachEv; const inp = document.getElementById(lab.dataset.file); if (inp) inp.click(); }
});
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (U.view === 'stats') drawCharts(); }, 150); });

/* ============ Démarrage ============ */
(async function boot() {
  document.documentElement.lang = 'fr';
  await Store.init();
  let data = migrate(await Store.load());
  if (!data) { D = freshData(); loadDemo(); persist(); }
  else D = data;
  const qs = new URLSearchParams(location.search);
  if (qs.get('vue') && ['journal', 'echeances', 'stats', 'docs', 'reglages'].includes(qs.get('vue'))) U.view = qs.get('vue');
  render();
  if (qs.has('ajouter')) openAddChooser();
  if (qs.has('ajouter') || qs.has('vue')) history.replaceState(null, '', location.pathname);
  takeShared();
  AI.init();
  if (D.docs.some(x => x.status === 'queued')) Queue.kick();
})();
</script>
<script>
/* Hors ligne, mise à jour signalée, partage depuis Android */
if ('serviceWorker' in navigator) {
  const had = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then(reg => { setInterval(() => reg.update().catch(() => {}), 6 * 3600 * 1000); }).catch(e => console.warn('Service worker', e)); });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had || document.querySelector('.upd')) return;
    const b = document.createElement('div'); b.className = 'upd'; b.setAttribute('role', 'status');
    b.innerHTML = '<span>Nouvelle version installée</span><button type="button">Recharger</button>';
    b.querySelector('button').onclick = () => location.reload(); document.body.appendChild(b);
  });
}
</script>
